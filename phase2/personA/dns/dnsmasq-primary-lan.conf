# phase2/personA/dns/dnsmasq-primary-lan.conf
# 4-Mac Primary DNS (Person A - Mac 1)
listen-address=0.0.0.0
bind-interfaces
domain-needed
bogus-priv
no-hosts

# Keep .test names local (prevents forwarding AAAA/other queries upstream)
local=/app.teamX.test/
local=/api.teamX.test/

# Extension B: Explicit 30-second TTL for controlled record change & cutover
local-ttl=30
host-record=app.teamX.test,10.7.29.79,30
host-record=api.teamX.test,10.7.29.79,30

# Public DNS fallback for non-project domains
no-resolv
server=8.8.8.8
server=8.8.4.4

log-queries
log-facility=/tmp/dnsmasq-primary-lan.log
