# phase2/personC/nginx/nginx-standby-lan.conf
# 4-Mac Standby Edge (Person C - Mac 3, Extension E)
worker_processes 1;
error_log logs/standby-lan-error.log info;
pid logs/standby-lan.pid;

events {
    worker_connections 1024;
}

http {
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/json;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$upstream_addr" "$upstream_response_time"';

    access_log logs/standby-lan-access.log main;

    sendfile        on;
    keepalive_timeout  65;

    upstream backend_pool {
        server 10.7.30.144:3001 max_fails=3 fail_timeout=5s;
        server 10.7.22.227:3002 max_fails=3 fail_timeout=5s;
    }

    # HTTP Edge Entrypoint (Port 8080)
    server {
        listen 8080;
        server_name localhost app.teamX.test api.teamX.test;

        add_header X-Edge "Standby-Mac3" always;

        location / {
            proxy_pass http://backend_pool;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass_header X-Backend;
            proxy_pass_header Cache-Control;
            proxy_pass_header ETag;

            proxy_buffering off;
        }
    }

    # HTTPS Edge Entrypoint (Port 8443 - TLS Termination)
    server {
        listen 8443 ssl;
        server_name localhost app.teamX.test api.teamX.test;

        ssl_certificate     ../../../personB/tls/server.crt;
        ssl_certificate_key ../../../personB/tls/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        add_header X-Edge "Standby-Mac3" always;

        location / {
            proxy_pass http://backend_pool;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass_header X-Backend;
            proxy_pass_header Cache-Control;
            proxy_pass_header ETag;

            proxy_buffering off;
        }
    }
}
