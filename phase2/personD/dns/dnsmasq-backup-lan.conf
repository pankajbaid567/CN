# phase2/personD/dns/dnsmasq-backup-lan.conf
# 4-Mac Backup DNS (Person D - Mac 4, Extension A)
listen-address=0.0.0.0
bind-interfaces
domain-needed
bogus-priv
no-hosts

# Keep .test names local (prevents forwarding AAAA/other queries upstream)
local=/app.teamX.test/
local=/api.teamX.test/

# Extension B: Matching 30-second TTL and records
local-ttl=30
host-record=app.teamX.test,10.7.29.79,30
host-record=api.teamX.test,10.7.29.79,30

# Public DNS fallback for non-project domains
no-resolv
server=8.8.8.8
server=8.8.4.4

log-queries
log-facility=/tmp/dnsmasq-backup-lan.log
